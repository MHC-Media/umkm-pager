<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard UMKM - Manajemen Produk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: { 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- HEADER SELLER -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-primary-600 text-white font-bold flex items-center justify-center">U</div>
        <div>
          <h2 class="font-bold text-sm">Dashboard Toko UMKM</h2>
          <span class="text-xs text-gray-500">Kelola Produk & Usaha Warga</span>
        </div>
      </div>
      <a href="../index.html" class="text-sm font-semibold text-gray-600 hover:text-primary-600 flex items-center space-x-1">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Keluar</span>
      </a>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">Manajemen Produk Toko</h1>
        <p class="text-sm text-gray-500">Tambah dan perbarui produk jualan Anda dengan mudah</p>
      </div>
      <button onclick="alert('Form tambah produk dibuka')" class="bg-primary-600 hover:bg-primary-700 text-white font-semibold px-4 py-2.5 rounded-xl text-sm flex items-center space-x-2 shadow">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Tambah Produk Baru</span>
      </button>
    </div>

    <!-- TABEL PRODUK TOKO -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700 text-gray-500">
              <th class="p-4">Produk</th>
              <th class="p-4">Harga</th>
              <th class="p-4">Stok</th>
              <th class="p-4">Status</th>
              <th class="p-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="seller-products-table" class="divide-y divide-gray-100 dark:divide-gray-700">
            <tr>
              <td colspan="5" class="p-8 text-center text-gray-500">Memuat produk toko Anda...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      // Contoh pemanggilan API produk toko
      const res = await ApiService.get("products.list");
      const tbody = document.getElementById("seller-products-table");
      if (res.success && res.data.length > 0) {
        tbody.innerHTML = res.data.map(prod => `
          <tr class="hover:bg-gray-50/50 dark:hover:bg-gray-700/30">
            <td class="p-4 flex items-center space-x-3">
              <img src="${prod.foto_utama || 'https://via.placeholder.com/60'}" class="w-12 h-12 object-cover rounded-lg bg-gray-100">
              <span class="font-semibold">${prod.nama_produk}</span>
            </td>
            <td class="p-4 font-bold text-primary-600">Rp${Number(prod.harga).toLocaleString('id-ID')}</td>
            <td class="p-4">${prod.stok || 10} unit</td>
            <td class="p-4"><span class="bg-green-100 text-green-700 text-xs font-semibold px-2.5 py-1 rounded-full">Aktif</span></td>
            <td class="p-4 text-center space-x-2">
              <button class="text-blue-600 hover:text-blue-800 p-1" title="Edit"><i data-lucide="edit" class="w-4 h-4"></i></button>
              <button class="text-red-500 hover:text-red-700 p-1" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </td>
          </tr>
        `).join("");
        lucide.createIcons();
      } else {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Belum ada produk yang terdaftar.</td></tr>`;
      }
    });
  </script>
</body>
</html>
